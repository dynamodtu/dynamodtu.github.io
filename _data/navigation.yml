# The links in the sidebar menu, in order.
# `children` adds a sub-menu (shown to the right on hover on large screens, indented on phones).
# Sub-menu links point to a section of the page: /page/#section-id
# Removing a link hides it from the menu, but does not remove the page itself.

main:
  - title: "Home"
    url: /

  - title: "Research"
    url: /research/
    children:
      - title: "Metal-based microrobots"
        url: /research/#metal-based-microrobots
      - title: "Polymer-based microrobots"
        url: /research/#polymer-based-microrobots
      - title: "Nature-based microrobots"
        url: /research/#nature-based-microrobots

  - title: "Publications"
    url: /publications/
    children:
      - title: "Journal articles"
        url: /publications/
      - title: "Conferences"
        url: /conferences/

  - title: "Members"
    url: /members/
    children:
      - title: "Principal Investigator"
        url: /members/#pi
      - title: "Postdocs"
        url: /members/#postdocs
      - title: "Ph.D. Students"
        url: /members/#phd-students
      - title: "M.S. & B.S. Students"
        url: /members/#masters-bachelors
      - title: "Alumni"
        url: /members/#alumni

  - title: "News"
    url: /news/

  - title: "Contact"
    url: /contact/
