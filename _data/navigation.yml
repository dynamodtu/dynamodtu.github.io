# The links in the sidebar menu, in order.
# `children` adds a sub-menu (shown to the right on hover on large screens, indented on phones).
# Sub-menu links point to a section of the page (/page/#section-id) or to a page of its own (/research/oral-drug-delivery/).
# Removing a link hides it from the menu, but does not remove the page itself.

main:
  - title: "Home"
    url: /

  - title: "Research"
    url: /research/
    children:
      - title: "Projects"
        url: /research/
        children:            # a sub-menu inside the sub-menu (one more level is possible here, not deeper)
          - title: "Skin & wound therapy"
            url: /research/skin-and-wound-therapy/
          - title: "Nose-to-brain drug delivery"
            url: /research/nose-to-brain-drug-delivery/
          - title: "Oral drug delivery"
            url: /research/oral-drug-delivery/
          - title: "SERS sensing"
            url: /research/sers-sensing/
      - title: "Funding"
        url: /funding/

  - title: "Publications"
    url: /publications/
    children:
      - title: "Journal articles"
        url: /publications/
      - title: "Conferences"
        url: /conferences/

  - title: "Members"
    url: /members/
    children:
      - title: "Principal Investigator"
        url: /members/#pi
      - title: "Postdocs"
        url: /members/#postdocs
      - title: "Ph.D. Students"
        url: /members/#phd-students
      - title: "Students"
        url: /members/#masters
      - title: "Alumni"
        url: /members/#alumni

  - title: "News"
    url: /news/

  - title: "Contact"
    url: /contact/
