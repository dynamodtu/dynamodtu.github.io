# The research cards on the home page, in order. Each links to its section on the Research page
# (/research/#<id>), so `id` must match the {#id} of a heading in _pages/research.md.
# `icon`: metal | polymer | nature (small drawings in _pages/home.html).
# TODO: check the texts below; they are a first draft based on the group's papers.

- id: metal-based-microrobots
  title: Metal-based microrobots
  icon: metal
  text: >
    Janus micro- and nanomotors from zinc, gold, platinum and TiO<sub>2</sub> that swim by light or chemical
    fuel, built for drug detection by SERS and for eradicating bacterial biofilms.

- id: polymer-based-microrobots
  title: Polymer-based microrobots
  icon: polymer
  text: >
    Shape-programmed polymer microdevices and microneedles that carry drugs through mucus and release
    them on demand, toward smarter oral drug delivery.

- id: nature-based-microrobots
  title: Nature-based microrobots
  icon: nature
  text: >
    Pollen grains, spore capsules and nanoclays turned into self-propelled robots: natural scaffolds
    for cleaning water and sensing pollutants.
