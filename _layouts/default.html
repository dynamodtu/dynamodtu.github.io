---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include dyn-sidebar.html %}

    <div class="dyn-content">
      {% if page.hero %}{% include dyn-hero.html %}{% endif %}
      {{ content }}
      {% include dyn-footer.html %}
    </div>

    {% include scripts.html %}
    <script src="{{ base_path }}/assets/js/dyn-sidebar.js" defer></script>
    <script src="{{ base_path }}/assets/js/dyn-email.js" defer></script>
    <script src="{{ base_path }}/assets/js/dyn-hero.js" defer></script>
    <script src="{{ base_path }}/assets/js/dyn-deadlines.js" defer></script>

  </body>
</html>
